<!DOCTYPE html>
{{generated}}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── SEO ── -->
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}" />
{{keywordsMeta}}
  <link rel="canonical" href="{{canonical}}" />
  <link rel="icon" type="image/png" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- ── Open Graph ── -->
  <meta property="og:type" content="article" />
  <meta property="og:url" content="{{canonical}}" />
  <meta property="og:title" content="{{ogTitle}}" />
  <meta property="og:description" content="{{ogDescription}}" />
  <meta property="og:image" content="{{ogImage}}" />
  <meta property="og:image:width" content="{{ogImageWidth}}" />
  <meta property="og:image:height" content="{{ogImageHeight}}" />
  <meta property="og:image:alt" content="{{ogImageAlt}}" />
  <meta property="og:site_name" content="Euro Polo" />
  <meta property="og:locale" content="en_MY" />
  <meta property="article:published_time" content="{{published}}" />
  <meta property="article:modified_time" content="{{modified}}" />
  <meta property="article:section" content="{{section}}" />

  <!-- ── Twitter Card ── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ogTitle}}" />
  <meta name="twitter:description" content="{{ogDescription}}" />
  <meta name="twitter:image" content="{{ogImage}}" />
  <meta name="twitter:image:alt" content="{{ogImageAlt}}" />

  <!-- ── JSON-LD ── -->
  <script type="application/ld+json">
{{jsonLd}}
  </script>

{{headCommon}}
  <link rel="stylesheet" href="css/journal.css" />
</head>
<body>

  <!-- ═══════════════════ NAVIGATION ═══════════════════ -->
{{nav}}

  <main class="article-page">

    <!-- ═══════════════════ ARTICLE HEADER ═══════════════════ -->
    <header class="article-head">
      <div class="article-head__inner">
        <p class="article-head__eyebrow">{{eyebrow}}</p>
        <h1 class="article-head__title{{titleClass}}">{{title}}</h1>
{{subtitleBlock}}
        <div class="article-meta">
          <time datetime="{{published}}">{{publishedLabel}}</time>
          <span class="article-meta__dot">&middot;</span>
          <span>{{readTime}}</span>
{{topicBlock}}
        </div>
      </div>
    </header>

    <!-- ═══════════════════ HERO IMAGE ═══════════════════ -->
{{heroFigure}}

    <!-- ═══════════════════ BREADCRUMB ═══════════════════ -->
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <div class="breadcrumb__inner">
        <a href="index.html">Home</a>
        <span class="breadcrumb__sep">&middot;</span>
        <a href="blog.html">Journal</a>
        <span class="breadcrumb__sep">&middot;</span>
        <span class="breadcrumb__current" aria-current="page">{{breadcrumbLabel}}</span>
      </div>
    </nav>

    <!-- ═══════════════════ ARTICLE BODY ═══════════════════ -->
    <article class="article-body">

{{body}}
{{ctaBlock}}
      <!-- ── Share + back ── -->
      <div class="article-foot">
        <a href="blog.html" class="article-back">&larr; Back to Journal</a>
        <div class="article-share">
          <span class="article-share__label">Share</span>
          <a href="https://wa.me/?text={{shareTextUrl}}"
             target="_blank" rel="noopener" aria-label="Share on WhatsApp">
            <svg viewBox="0 0 24 24"><path d="M20.52 3.48A11.93 11.93 0 0 0 12 0C5.37 0 0 5.37 0 12c0 2.11.55 4.16 1.6 5.97L0 24l6.18-1.57A11.94 11.94 0 0 0 12 24c6.63 0 12-5.37 12-12 0-3.21-1.25-6.22-3.48-8.52zM12 22c-1.85 0-3.66-.5-5.24-1.44l-.37-.22-3.87.99 1.02-3.77-.24-.39A9.93 9.93 0 0 1 2 12C2 6.49 6.49 2 12 2c2.66 0 5.16 1.04 7.04 2.92A9.92 9.92 0 0 1 22 12c0 5.51-4.49 10-10 10zm5.47-7.47c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.95 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.47-.89-.79-1.49-1.76-1.66-2.06-.18-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.6-.91-2.19-.24-.57-.49-.5-.67-.5-.17 0-.37-.02-.57-.02-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.47s1.07 2.87 1.22 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.08 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35z"/></svg>
          </a>
          <a href="https://www.facebook.com/sharer/sharer.php?u={{shareUrl}}"
             target="_blank" rel="noopener" aria-label="Share on Facebook">
            <svg viewBox="0 0 24 24"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.95.93-1.95 1.88v2.27h3.32l-.53 3.49h-2.79V24C19.61 23.1 24 18.1 24 12.07z"/></svg>
          </a>
          <a href="https://t.me/share/url?url={{shareUrl}}&amp;text={{shareTitleUrl}}"
             target="_blank" rel="noopener" aria-label="Share on Telegram">
            <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
          </a>
        </div>
      </div>

    </article>
{{relatedBlock}}
  </main>

  <!-- ═══════════════════ FOOTER ═══════════════════ -->
{{footer}}

  <script src="script.js"></script>
  <script src="cart.js"></script>
  <script src="content-injector.js"></script>
</body>
</html>
