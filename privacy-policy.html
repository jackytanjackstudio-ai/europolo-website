<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Privacy Policy &mdash; Euro Polo Malaysia</title>

  <!-- Redirect, not a copy. The policy lives at privacy.html, which is the URL
       already linked from every footer and listed in sitemap.xml. Serving the
       text at two URLs would create duplicate content and let the two drift.
       canonical + noindex keep search engines pointed at the original. -->
  <link rel="canonical" href="https://europolo.my/privacy.html"/>
  <meta name="robots" content="noindex,follow"/>
  <meta http-equiv="refresh" content="0; url=privacy.html"/>
  <script>location.replace('privacy.html');</script>
</head>
<body>
  <p>Redirecting to our <a href="privacy.html">Privacy Policy</a>&hellip;</p>
</body>
</html>
